name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches: [ main, master ]

jobs:
  ci:
    name: CI (${{ matrix.os }} - ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: g++
            cc: gcc
            cxx: g++
          - os: macos-latest
            compiler: clang
            cc: clang
            cxx: clang++

    steps:
      - name: Checkout COLA_UrQMD
        uses: actions/checkout@v6
        with:
          path: COLA_UrQMD

      - name: Checkout COLA_Fortran
        uses: actions/checkout@v6
        with:
          repository: ZakayZ/COLA_Fortran
          # Keep the generated Fortran API compatible with the COLA revision below.
          ref: 852688e7200ef1510c64228e77ae83043f5f4c78
          path: COLA_Fortran

      - name: Checkout COLA
        uses: actions/checkout@v6
        with:
          repository: ZakayZ/COLA
          ref: 7e61da42e831b29baaaf9efea98f0b3d416e35da
          path: cola

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake g++ gfortran \
            libgtest-dev clang-format-19 clang-tidy-18
          pip install cmake-format
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install cmake googletest

      - name: Setup Fortran
        if: matrix.os == 'macos-latest'
        uses: fortran-lang/setup-fortran@v1

      - name: Build and install COLA
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S cola -B cola/build \
            -DCMAKE_INSTALL_PREFIX=cola/install \
            -DBUILD_TESTING=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build cola/build --parallel
          cmake --install cola/build

      - name: Build and install COLA_Fortran
        working-directory: ${{ github.workspace }}/COLA_Fortran
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          export CMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/cola/install:${CMAKE_PREFIX_PATH}"
          cmake --preset release
          cmake --build --preset release --parallel
          cmake --install build/release

      - name: Build and test (release)
        working-directory: ${{ github.workspace }}/COLA_UrQMD
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          export CMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/cola/install:${CMAKE_PREFIX_PATH}"
          cmake --workflow release-test

      - name: Clang-tidy and unit tests (debug + tidy)
        working-directory: ${{ github.workspace }}/COLA_UrQMD
        if: matrix.os == 'ubuntu-24.04'
        run: |
          export CMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/cola/install:${CMAKE_PREFIX_PATH}"
          cmake --workflow test

      - name: Check formatting
        working-directory: ${{ github.workspace }}/COLA_UrQMD
        if: always() && matrix.os == 'ubuntu-24.04'
        run: |
          export CMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/cola/install:${CMAKE_PREFIX_PATH}"
          cmake --workflow check-format
